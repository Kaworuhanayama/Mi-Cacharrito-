<div class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h2>Vehículos no entregados</h2><button class="btn btn-primary" (click)="cargar()">Actualizar</button></div><div *ngIf="mensaje" class="alert alert-info">{{mensaje}}</div><div class="table-responsive card"><table class="table table-hover mb-0"><thead class="table-dark"><tr><th>Placa</th><th>Tipo</th><th>Color</th><th>Alquiler</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr *ngFor="let v of vehiculos"><td>{{v.placa}}</td><td>{{v.tipoVehiculo}}</td><td>{{v.color}}</td><td>{{v.numeroAlquiler}}</td><td><span class="badge text-bg-warning">{{v.estado}}</span></td><td><button class="btn btn-sm btn-success" (click)="entregar(v)">Entregar</button></td></tr><tr *ngIf="vehiculos.length===0"><td colspan="6" class="text-center py-4">No hay vehículos pendientes.</td></tr></tbody></table></div></div>
