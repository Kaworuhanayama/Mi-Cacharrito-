<div class="container py-4"><h2 class="mb-3">Búsqueda y gestión</h2><div class="card p-3 mb-3"><div class="row g-2"><div class="col-md-3"><select class="form-select" [(ngModel)]="modo"><option value="placa">Por placa</option><option value="alquiler">Por número de alquiler</option></select></div><div class="col-md-7"><input class="form-control" [(ngModel)]="valor" placeholder="Ingrese placa o número"></div><div class="col-md-2"><button class="btn btn-primary w-100" (click)="buscar()">Buscar</button></div></div></div><div *ngIf="mensaje" class="alert alert-info">{{mensaje}}</div><div *ngIf="vehiculo" class="card p-4"><h4>{{vehiculo.placa}} - {{vehiculo.tipoVehiculo}}</h4><p>Color: {{vehiculo.color}} | Estado: <strong>{{vehiculo.estado}}</strong></p><p>Número de alquiler: {{vehiculo.numeroAlquiler}}</p><p>Valor: {{vehiculo.valorAlquiler | number}}</p><div class="d-flex gap-2"><button class="btn btn-success" (click)="entregar()" [disabled]="vehiculo.estado !== 'alquilado'">Marcar entregado</button><button class="btn btn-warning" (click)="finalizar()" [disabled]="vehiculo.estado !== 'alquilado' || !vehiculo.numeroAlquiler">Finalizar alquiler</button></div></div></div>
