<main class="registro-page">
  <section class="registro-card" aria-labelledby="registro-title">
    <a routerLink="/login/usuario" class="back-link">&#8592; Volver al login</a>
    <p class="eyebrow">NUEVA CUENTA</p>
    <h1 id="registro-title">Regístrate en Mi Cacharrito</h1>
    <p class="intro">Completa tus datos para comenzar a gestionar tus alquileres.</p>

    <form #registroForm="ngForm" (ngSubmit)="registrar(registroForm)" novalidate>
      <div class="form-grid">
        <div class="campo campo-completo">
          <label for="identificacion">Identificación</label>
          <input id="identificacion" name="identificacion" type="text" [(ngModel)]="registro.identificacion" required maxlength="30" autocomplete="username">
        </div>
        <div class="campo campo-completo">
          <label for="nombreCompleto">Nombre completo</label>
          <input id="nombreCompleto" name="nombreCompleto" type="text" [(ngModel)]="registro.nombreCompleto" required maxlength="120">
        </div>
        <div class="campo">
          <label for="fechaExpedicionLicencia">Expedición de licencia</label>
          <input id="fechaExpedicionLicencia" name="fechaExpedicionLicencia" type="date" [(ngModel)]="registro.fechaExpedicionLicencia" required>
        </div>
        <div class="campo">
          <label for="vigencia">Vigencia de licencia</label>
          <input id="vigencia" name="vigencia" type="date" [(ngModel)]="registro.vigencia" required>
        </div>
        <div class="campo">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria" [(ngModel)]="registro.categoria" required>
            <option value="" disabled>Selecciona</option>
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
            <option value="B3">B3</option>
            <option value="C1">C1</option>
            <option value="C2">C2</option>
            <option value="C3">C3</option>
          </select>
        </div>
        <div class="campo">
          <label for="numeroTelefono">Número de teléfono</label>
          <input id="numeroTelefono" name="numeroTelefono" type="tel" [(ngModel)]="registro.numeroTelefono" required maxlength="20">
        </div>
        <div class="campo campo-completo">
          <label for="correoElectronico">Correo electrónico</label>
          <input id="correoElectronico" name="correoElectronico" type="email" [(ngModel)]="registro.correoElectronico" required email maxlength="120" autocomplete="email">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" [(ngModel)]="registro.password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="campo">
          <label for="confirmarPassword">Confirmar contraseña</label>
          <input id="confirmarPassword" name="confirmarPassword" type="password" [(ngModel)]="confirmarPassword" required minlength="6" autocomplete="new-password">
        </div>
      </div>

      <p *ngIf="error" class="mensaje-error" role="alert">{{ error }}</p>
      <p *ngIf="registrado" class="mensaje-exito" role="status">Registro exitoso. Ya puedes iniciar sesión.</p>
      <button type="submit" [disabled]="enviando">{{ enviando ? 'Registrando...' : 'Crear cuenta' }}</button>
    </form>
  </section>
</main>
